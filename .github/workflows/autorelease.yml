name: autorelease

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: latest
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Run codegen
        run: mise run codegen

      - name: Create PR if changes
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            BRANCH_NAME="chore/codegen-${{ github.sha }}"
            git commit -m "chore: update generated code"
            git push origin HEAD:refs/heads/$BRANCH_NAME
            gh pr create --title "chore: update generated code" --body "Automated PR created by autorelease workflow" --head $BRANCH_NAME --base ${{ github.ref_name }}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI
        run: mise run ci

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="v0.0.${{ github.run_number }}"
            gh release create "$TAG_NAME" --generate-notes --title "Release $TAG_NAME"
          else
            gh release create ${{ github.ref_name }} --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && hashFiles('dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
