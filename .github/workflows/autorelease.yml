name: autorelease

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: mise run codegen
      - name: Create PR if codegen changed files
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git checkout -B chore/codegen-update
            git add .
            git commit -m "chore: update codegen"
            git push origin chore/codegen-update --force
            gh pr create --title "chore: update codegen" --body "Autogenerated PR for codegen updates" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ci
      - run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref_type }}" != "tag" ]]; then
            TAG_NAME="manual-$(date +'%Y%m%d%H%M%S')"
          fi
          gh release create "$TAG_NAME" --generate-notes || true
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            dist/
            build/
            target/
        if: always()
