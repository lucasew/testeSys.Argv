[tools]
python = "3.12.1"
node = "20.11.0"
go = "1.22.0"
actionlint = "1.6.26"

[tasks.install]
description = "Install dependencies"
depends = ["install:*"]

[tasks."install:python"]
run = "echo 'No python dependencies to install'"

[tasks."install:workspaced"]
description = "Install workspaced from source"
run = """
if ! command -v workspaced &> /dev/null; then
  echo "Installing workspaced..."
  TEMP_DIR=$(mktemp -d)
  git clone --depth 1 https://github.com/lucasew/workspaced "$TEMP_DIR"
  cd "$TEMP_DIR"
  go install ./cmd/workspaced
  rm -rf "$TEMP_DIR"
else
  echo "workspaced already installed"
fi
"""

[tasks.lint]
description = "Lint the codebase"
depends = ["install:workspaced"]
run = "workspaced codebase lint"

[tasks.fmt]
description = "Format the codebase"
depends = ["install:workspaced"]
run = "workspaced codebase format"

[tasks.test]
description = "Run tests"
depends = ["test:*"]

[tasks."test:python"]
run = "python -m unittest discover || echo 'No tests found'"

[tasks.codegen]
description = "Update generated code"
depends = ["codegen:*"]

[tasks."codegen:noop"]
run = "echo 'No codegen tasks defined'"

[tasks.ci]
description = "Run CI pipeline"
depends = ["lint", "test"]
